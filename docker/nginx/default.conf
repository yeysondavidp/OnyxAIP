server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS, short TTL — without this, nginx resolves "app"
    # once at worker startup and caches it for the worker's lifetime. Any
    # deploy that recreates the app container (new IP) then 502s with
    # "connect() failed (111: Connection refused)" until nginx itself is
    # restarted. A resolver + variable forces per-request re-resolution
    # instead (learned the hard way on the first prod deploy after this).
    resolver 127.0.0.11 valid=10s;
    set $upstream_app app:9000;

    # Never serve storage/ directly — files go through signed URLs only (§14.3)
    location ^~ /storage/ {
        return 403;
    }

    # Livewire serves its JS/update endpoints dynamically under a per-install,
    # APP_KEY-derived "/livewire-<hash>" prefix (see vendor/livewire/livewire's
    # EndpointResolver) — the JS path ends in .js, so without this it falls
    # into the static-asset regex below, which 404s it as a missing file
    # instead of routing to PHP. That silently breaks every wire:model/
    # wire:click interaction site-wide (no JS = no Livewire runtime loaded).
    location ^~ /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Static assets — long cache, immutable for Vite-fingerprinted files
    location ~* \.(css|js|woff2?|ttf|otf|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny hidden files (e.g. .env)
    location ~ /\. {
        deny all;
    }
}
