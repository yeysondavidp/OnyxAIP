; Matches the app's photo validation ceiling (JobFlowController: max:20480 KB)
; plus headroom so PHP's own limit isn't the thing rejecting an in-range file.
upload_max_filesize=21M
post_max_size=25M

; PHP2shell (CVE-2026-109618/-109619) is reached through session upload progress.
; The app doesn't use it, so keep it off even on a patched PHP.
session.upload_progress.enabled=Off
