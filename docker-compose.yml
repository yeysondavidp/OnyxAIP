# ONYX AIP — Docker Compose (dev + prod parity)
# Topology: ADR-002. MySQL is a shared external container (DB_HOST in .env).
# Redis is defined here — owned by this project, shared network for future adopters.
#
# ── First-time setup ─────────────────────────────────────────────────────────
# 1. Create the shared Docker network (once per host):
#      docker network create shared_net
#
# 2. Provision the ONYX AIP database + user on the shared MySQL container:
#      docker exec -i <mysql_container> mysql -uroot -p < docker/mysql/provision.sql
#    Then set DB_HOST, DB_PASSWORD in .env.
#
# 3. Copy .env.example → .env and fill in APP_KEY, DB_PASSWORD, MAIL_* etc.
#      cp .env.example .env && php artisan key:generate --show
#      (paste the key into .env as APP_KEY)
#
# 4. Start the stack and run migrations:
#      docker compose up -d
#      docker compose exec app php artisan migrate --force
#
# ── Day-to-day ───────────────────────────────────────────────────────────────
#   docker compose up -d          — start the stack
#   docker compose exec app php artisan migrate
#   docker compose logs -f queue  — tail queue worker
#   docker compose exec app php artisan tinker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ----------------------------------------------------------------
  # nginx — reverse proxy + static file server
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage/app:ro   # read-only: serves nothing directly (see conf)
      - app_public:/var/www/html/public:ro   # nginx has no copy of its own — see app_public below
    networks:
      - onyx_net
    depends_on:
      - app

  # ----------------------------------------------------------------
  # app — Laravel php-fpm
  # ----------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # Refreshes app_public from this image's /opt/public-dist snapshot before
    # every boot — mounting app_public over public/ would otherwise leave
    # nginx serving whatever was there from a previous image (see app_public
    # below), including on a redeploy where the Vite build actually changed.
    command: sh -c "find /var/www/html/public -mindepth 1 -delete; cp -a /opt/public-dist/. /var/www/html/public/; exec php-fpm"
    env_file: .env
    environment:
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_public:/var/www/html/public   # populated by the command above
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # queue — async jobs: email dispatch, audit log writes (§14.5)
  # ----------------------------------------------------------------
  queue:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    env_file: .env
    environment:
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # scheduler — SLA clock, warranty reminders, backup job (§10, §12)
  # ----------------------------------------------------------------
  scheduler:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # redis — queue + cache + sessions (AOF + noeviction, ADR-002)
  # Sits on shared_net so other projects on this host can adopt it.
  # ONYX AIP uses DB 0 (queue) and DB 1 (cache). Pick a free index
  # and set a unique REDIS_PREFIX to namespace a new adopter.
  # ----------------------------------------------------------------
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - onyx_net
      - shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  app_storage:
    # Photos + generated PDFs/QR labels — bind-mounted so they survive a
    # container recreate. Path matches this host's /srv/docker/<project>
    # convention (see /srv/docker/onyx/storage for the onyx-vein sibling).
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_PATH:-/srv/docker/onyx-aip/storage}
  redis_data:
    # AOF persistence — queued jobs survive a restart
  app_public:
    # nginx's own image has no /var/www/html/public at all — it's only ever
    # baked into the app image (Vite-compiled assets included). Shared with
    # nginx so it can serve/realpath() static files; kept fresh on every
    # `app` boot by its command (see above), not by Docker's volume-populate-
    # on-first-mount behavior, since that wouldn't pick up a later rebuild.

# ----------------------------------------------------------------
# Networks
# ----------------------------------------------------------------
networks:
  onyx_net:
    # Internal network: nginx ↔ app ↔ queue ↔ scheduler ↔ redis
    driver: bridge
  shared_net:
    # Shared host network: exposes Redis to other projects + lets
    # app/queue/scheduler reach the shared MySQL container.
    # Create once on the host: docker network create shared_net
    external: true
    name: ${SHARED_NETWORK:-shared_net}
