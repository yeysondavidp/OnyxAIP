# ONYX AIP — Docker Compose (production)
# Topology: ADR-002. MySQL is a shared external container (DB_HOST in .env).
# Redis is defined here — owned by this project, shared network for future adopters.
#
# Images are built via GitHub Actions on every push to master and pushed to
# ghcr.io — this file has no build: directives so a server deploy is a plain
# pull + up. For local development (building from source instead of pulling),
# copy docker-compose.override.yml.example to docker-compose.override.yml.
#
# ── First-time setup ─────────────────────────────────────────────────────────
# 1. Create the shared Docker network (once per host):
#      docker network create shared_net
#
# 2. Provision the ONYX AIP database + user on the shared MySQL container:
#      docker exec -i <mysql_container> mysql -uroot -p < docker/mysql/provision.sql
#      (docker/mysql/provision-prod.sql for a separate production database/user)
#    Then set DB_HOST, DB_PASSWORD in .env.
#
# 3. Copy .env.example → .env and fill in APP_KEY, DB_PASSWORD, MAIL_* etc.
#      cp .env.example .env && php artisan key:generate --show
#      (paste the key into .env as APP_KEY)
#
# 4. Pull the images and start the stack — migrations run automatically on
#    `app` boot (RUN_MIGRATIONS_ON_BOOT below; see docker/entrypoint.sh):
#      docker compose pull && docker compose up -d
#
# ── Day-to-day ───────────────────────────────────────────────────────────────
#   docker compose pull && docker compose up -d   — deploy the latest image
#   docker compose logs -f queue                   — tail queue worker
#   docker compose exec app php artisan tinker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ----------------------------------------------------------------
  # nginx — reverse proxy + static file server
  # public/ (Vite build included) is baked into this image at build
  # time (docker/Dockerfile's `nginx` target) — no shared volume with
  # `app` needed, so a redeploy always ships exactly what was built.
  # ----------------------------------------------------------------
  nginx:
    image: ghcr.io/yeysondavidp/onyx-aip-nginx:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage/app:ro   # read-only: serves nothing directly (see conf)
    networks:
      - onyx_net
    depends_on:
      - app

  # ----------------------------------------------------------------
  # app — Laravel php-fpm
  # ----------------------------------------------------------------
  app:
    image: ghcr.io/yeysondavidp/onyx-aip-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS_ON_BOOT: "true"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # queue — async jobs: email dispatch, audit log writes (§14.5)
  # ----------------------------------------------------------------
  queue:
    image: ghcr.io/yeysondavidp/onyx-aip-app:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # scheduler — SLA clock, warranty reminders, backup job (§10, §12)
  # ----------------------------------------------------------------
  scheduler:
    image: ghcr.io/yeysondavidp/onyx-aip-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - onyx_net
      - shared_net
    depends_on:
      - redis

  # ----------------------------------------------------------------
  # redis — queue + cache + sessions (AOF + noeviction, ADR-002)
  # Sits on shared_net so other projects on this host can adopt it.
  # ONYX AIP uses DB 0 (queue) and DB 1 (cache). Pick a free index
  # and set a unique REDIS_PREFIX to namespace a new adopter.
  # ----------------------------------------------------------------
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - onyx_net
      - shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  app_storage:
    # Photos + generated PDFs/QR labels — bind-mounted so they survive a
    # container recreate. Path matches this host's /srv/docker/<project>
    # convention (see /srv/docker/onyx/storage for the onyx-vein sibling).
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_PATH:-/srv/docker/onyx-aip/storage}
  redis_data:
    # AOF persistence — queued jobs survive a restart

# ----------------------------------------------------------------
# Networks
# ----------------------------------------------------------------
networks:
  onyx_net:
    # Internal network: nginx ↔ app ↔ queue ↔ scheduler ↔ redis
    driver: bridge
  shared_net:
    # Shared host network: exposes Redis to other projects + lets
    # app/queue/scheduler reach the shared MySQL container.
    # Create once on the host: docker network create shared_net
    external: true
    name: ${SHARED_NETWORK:-shared_net}
