name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/yeysondavidp/onyx-aip-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: nginx
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/yeysondavidp/onyx-aip-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged app image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: onyx-aip-app
          package-type: container
          delete-only-untagged-versions: true

      - name: Prune untagged nginx image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: onyx-aip-nginx
          package-type: container
          delete-only-untagged-versions: true
