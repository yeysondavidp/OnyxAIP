name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build image · Pint · Larastan · Pest (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onyx_aip_test
          MYSQL_USER: onyx_aip
          MYSQL_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage Dockerfile used for deployment (ADR-002),
      # through its `test` stage — this validates the Node asset build and the
      # PHP-FPM runtime image actually build, not just that the app code works.
      - name: Build test image
        run: docker build --target test -t onyx-aip:test .

      # .env is excluded from the image (.dockerignore), so any command that
      # boots the framework (Larastan, Pest — Pint doesn't) needs one mounted
      # in, or config defaults that call realpath()/etc. at boot can misbehave
      # with no environment to read from.
      - name: Prepare .env for the containers
        run: |
          cat > .env <<EOF
          APP_ENV=testing
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=onyx_aip_test
          DB_USERNAME=onyx_aip
          DB_PASSWORD=secret
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          SESSION_DRIVER=array
          MAIL_MAILER=array
          EOF

      # tests/ is excluded from the image via .dockerignore to keep the
      # production `runtime` image lean, so it's mounted in here instead of
      # being baked into a layer.
      - name: Security audit
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test composer audit --no-dev

      - name: Style check (Pint)
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test ./vendor/bin/pint --test

      # --network host puts the container on the runner's network namespace
      # so it can reach the mysql service container at 127.0.0.1:3306.
      - name: Static analysis (Larastan level 5)
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/phpstan analyse --memory-limit=1G

      # Fails fast and clearly if the container can't actually reach the
      # mysql service over --network host, instead of leaving Pest to hang
      # ambiguously (mysql client is already in the runtime image).
      - name: Verify DB connectivity
        timeout-minutes: 1
        run: >
          docker run --rm --network host
          onyx-aip:test mysql -h127.0.0.1 -P3306 -uonyx_aip -psecret -e "SELECT 1"

      - name: Tests (Pest)
        timeout-minutes: 10
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/pest --ci
