name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build image · Pint · Larastan · Pest (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onyx_aip_test
          MYSQL_USER: onyx_aip
          MYSQL_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage Dockerfile used for deployment (ADR-002),
      # through its `test` stage — this validates the Node asset build and the
      # PHP-FPM runtime image actually build, not just that the app code works.
      - name: Build test image
        run: docker build --target test -t onyx-aip:test .

      # .env is excluded from the image (.dockerignore), so any command that
      # boots the framework (Larastan, Pest — Pint doesn't) needs one mounted
      # in, or config defaults that call realpath()/etc. at boot can misbehave
      # with no environment to read from.
      - name: Prepare .env for the containers
        run: |
          cat > .env <<EOF
          APP_ENV=testing
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=onyx_aip_test
          DB_USERNAME=onyx_aip
          DB_PASSWORD=secret
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          SESSION_DRIVER=array
          MAIL_MAILER=array
          EOF

      # tests/ is excluded from the image via .dockerignore to keep the
      # production `runtime` image lean, so it's mounted in here instead of
      # being baked into a layer.
      - name: Security audit
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test composer audit --no-dev

      - name: Style check (Pint)
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test ./vendor/bin/pint --test

      # --network host puts the container on the runner's network namespace
      # so it can reach the mysql service container at 127.0.0.1:3306.
      - name: Static analysis (Larastan level 5)
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/phpstan analyse --memory-limit=1G

      # mysql:8.0 defaults new users to caching_sha2_password. Alpine's
      # mysql-client package is actually MariaDB's client under the hood,
      # which doesn't ship that plugin's .so file ("ERROR 1045: Plugin
      # caching_sha2_password could not be loaded") — confirmed by hand,
      # not guessed. PHP's own PDO driver (mysqlnd) implements the plugin
      # natively and isn't affected, but switching the CI user to the
      # universally-compatible mysql_native_password removes any doubt.
      - name: Switch MySQL auth plugin to mysql_native_password
        run: |
          cat > fix-mysql-auth.php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306', 'root', 'root');
          $pdo->exec("ALTER USER 'onyx_aip'@'%' IDENTIFIED WITH mysql_native_password BY 'secret'");
          $pdo->exec('FLUSH PRIVILEGES');
          echo "OK\n";
          PHP
          docker run --rm --network host -v ${{ github.workspace }}/fix-mysql-auth.php:/tmp/fix-mysql-auth.php:ro onyx-aip:test php /tmp/fix-mysql-auth.php

      # Fails fast and clearly if the container can't actually reach the
      # mysql service over --network host, instead of leaving Pest to hang
      # ambiguously. Uses PHP's own PDO driver — the same one Laravel uses —
      # not the system mysql CLI, which is unreliable in this image (above).
      - name: Verify DB connectivity
        timeout-minutes: 1
        run: |
          cat > verify-db.php <<'PHP'
          <?php
          new PDO('mysql:host=127.0.0.1;port=3306;dbname=onyx_aip_test', 'onyx_aip', 'secret');
          echo "OK\n";
          PHP
          docker run --rm --network host -v ${{ github.workspace }}/verify-db.php:/tmp/verify-db.php:ro onyx-aip:test php /tmp/verify-db.php

      # migrate:fresh with --force succeeded standalone, ruling out the
      # migration process itself. Pest's RefreshDatabase calls migrate:fresh
      # internally WITHOUT --force, though — if the app doesn't resolve to a
      # non-production environment for any reason, Laravel's
      # confirmToProceed() falls back to an interactive Prompts confirm(),
      # which hangs forever with no TTY attached. This reproduces that exact
      # call (no --force) in isolation, with a tight timeout, to prove or
      # rule out that theory directly instead of guessing further.
      - name: Run migrations without --force (isolated diagnostic)
        timeout-minutes: 1
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test php artisan migrate:fresh -v

      # migrate:fresh succeeds fine standalone, with or without --force, and
      # even a single already-passing-locally Feature file hangs the same
      # way through Pest — ruling out the migration command, RefreshDatabase,
      # a specific test, and a stdin/TTY issue (tried -i < /dev/null, no
      # change). Every run's log shows an identical "mkdir(): Permission
      # denied" warning from pest-plugin-mutate's cache dir right before the
      # stall — vendor/ is root-owned (every RUN before `USER app` executes
      # as root), so this failed write is real regardless of whether it's
      # the actual cause. Fixed the ownership in the Dockerfile; this step
      # re-tests the same single file to see if that was it.
      - name: Run one Feature test file via Pest (isolated diagnostic)
        timeout-minutes: 2
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/pest tests/Feature/Assets/AssetCrudTest.php --ci

      - name: Tests (Pest)
        timeout-minutes: 10
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/pest --ci
