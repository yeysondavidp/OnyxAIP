name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build image · Pint · Larastan (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage Dockerfile used for deployment (ADR-002),
      # through its `test` stage — this validates the Node asset build and the
      # PHP-FPM runtime image actually build, not just that the app code works.
      - name: Build test image
        run: docker build --target test -t onyx-aip:test .

      # .env is excluded from the image (.dockerignore), so any command that
      # boots the framework (Larastan — Pint doesn't) needs one mounted in, or
      # config defaults that call realpath()/etc. at boot can misbehave with
      # no environment to read from. Larastan never connects to a real DB, so
      # these DB_* values just need to exist, not resolve to anything live.
      - name: Prepare .env for the containers
        run: |
          cat > .env <<EOF
          APP_ENV=testing
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=onyx_aip_test
          DB_USERNAME=onyx_aip
          DB_PASSWORD=secret
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          SESSION_DRIVER=array
          MAIL_MAILER=array
          EOF

      # tests/ is excluded from the image via .dockerignore to keep the
      # production `runtime` image lean, so it's mounted in here instead of
      # being baked into a layer. --entrypoint overrides docker/entrypoint.sh
      # (ENTRYPOINT in the Dockerfile) — these are one-off tool invocations,
      # not the app booting as a service, so its migrate/APP_KEY/cache-warm
      # logic doesn't apply and would otherwise fail these steps outright.
      - name: Security audit
        run: >
          docker run --rm --entrypoint composer
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test audit --no-dev

      - name: Style check (Pint)
        run: >
          docker run --rm --entrypoint ./vendor/bin/pint
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test --test

      - name: Static analysis (Larastan level 5)
        run: >
          docker run --rm --entrypoint ./vendor/bin/phpstan
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test analyse --memory-limit=1G

      # Pest is deliberately NOT run here. RefreshDatabase's migrate:fresh
      # against a real MySQL connection hung for an identical ~12 minutes on
      # GitHub's hosted runner across three different MySQL setups (services:
      # container, services: + tmpfs, manual `docker run` + tmpfs) — while an
      # exact local repro of the same image/flags/command passed clean in
      # 130s. That rules out our MySQL config as the cause; it's specific to
      # running Pest-against-real-MySQL inside GitHub's hosted runner itself.
      # onyx-vein sidesteps this the same way: its CI only builds/pushes
      # Docker images too, and the suite runs locally against a real MySQL
      # box (see TESTING.md here for the equivalent onyx-aip setup) — SQLite
      # is not an option for either app since some migrations use raw
      # MySQL-only DDL (see create_technician_profiles_table.php).
