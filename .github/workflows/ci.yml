name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Build image · Pint · Larastan · Pest (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onyx_aip_test
          MYSQL_USER: onyx_aip
          MYSQL_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage Dockerfile used for deployment (ADR-002),
      # through its `test` stage — this validates the Node asset build and the
      # PHP-FPM runtime image actually build, not just that the app code works.
      - name: Build test image
        run: docker build --target test -t onyx-aip:test .

      # .env is excluded from the image (.dockerignore), so any command that
      # boots the framework (Larastan, Pest — Pint doesn't) needs one mounted
      # in, or config defaults that call realpath()/etc. at boot can misbehave
      # with no environment to read from.
      - name: Prepare .env for the containers
        run: |
          cat > .env <<EOF
          APP_ENV=testing
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=onyx_aip_test
          DB_USERNAME=onyx_aip
          DB_PASSWORD=secret
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          SESSION_DRIVER=array
          MAIL_MAILER=array
          EOF

      # tests/ is excluded from the image via .dockerignore to keep the
      # production `runtime` image lean, so it's mounted in here instead of
      # being baked into a layer.
      - name: Security audit
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test composer audit --no-dev

      - name: Style check (Pint)
        run: >
          docker run --rm
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          onyx-aip:test ./vendor/bin/pint --test

      # --network host puts the container on the runner's network namespace
      # so it can reach the mysql service container at 127.0.0.1:3306.
      - name: Static analysis (Larastan level 5)
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/phpstan analyse --memory-limit=1G

      # mysql:8.0 defaults new users to caching_sha2_password. Alpine's
      # mysql-client package is actually MariaDB's client under the hood,
      # which doesn't ship that plugin's .so file ("ERROR 1045: Plugin
      # caching_sha2_password could not be loaded"). PHP's own PDO driver
      # (mysqlnd) implements the plugin natively and isn't affected, but
      # switching the CI user to the universally-compatible
      # mysql_native_password removes any doubt for anything that shells out.
      - name: Switch MySQL auth plugin to mysql_native_password
        run: |
          cat > fix-mysql-auth.php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306', 'root', 'root');
          $pdo->exec("ALTER USER 'onyx_aip'@'%' IDENTIFIED WITH mysql_native_password BY 'secret'");
          $pdo->exec('FLUSH PRIVILEGES');
          echo "OK\n";
          PHP
          docker run --rm --network host -v ${{ github.workspace }}/fix-mysql-auth.php:/tmp/fix-mysql-auth.php:ro onyx-aip:test php /tmp/fix-mysql-auth.php

      # Fails fast and clearly if the container can't actually reach the
      # mysql service over --network host, instead of leaving Pest to fail
      # ambiguously. Uses PHP's own PDO driver — the same one Laravel uses —
      # not the system mysql CLI, which is unreliable in this image (above).
      - name: Verify DB connectivity
        timeout-minutes: 1
        run: |
          cat > verify-db.php <<'PHP'
          <?php
          new PDO('mysql:host=127.0.0.1;port=3306;dbname=onyx_aip_test', 'onyx_aip', 'secret');
          echo "OK\n";
          PHP
          docker run --rm --network host -v ${{ github.workspace }}/verify-db.php:/tmp/verify-db.php:ro onyx-aip:test php /tmp/verify-db.php

      # The first RefreshDatabase-using test pays a one-time migration cost
      # against a fresh MySQL container, then every subsequent test is fast —
      # confirmed via a full local reproduction (Docker/Colima): 330 tests in
      # 135.89s, not a hang. That migration cost is 5-10x slower on GitHub's
      # actual runners than locally (confirmed: identical setup times out
      # past 10 minutes there while finishing in ~100-105s here), so this
      # needs real headroom rather than a tight leash.
      - name: Tests (Pest)
        timeout-minutes: 15
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/tests:/var/www/html/tests:ro
          -v ${{ github.workspace }}/.env:/var/www/html/.env:ro
          onyx-aip:test ./vendor/bin/pest --ci
